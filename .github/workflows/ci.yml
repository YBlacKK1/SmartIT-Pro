name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: |
          dotnet restore SmartIT.sln
          dotnet restore SmartIT.Tests/SmartIT.Tests.csproj

      - name: Build
        run: dotnet build SmartIT.sln --configuration Release

      - name: Test
        run: dotnet test SmartIT.Tests/SmartIT.Tests.csproj --configuration Release --no-build